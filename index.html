<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ibis</title>
<meta name="description" content="A bin chicken loose on a suburban street">
<meta name="theme-color" content="#ece6da">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ibis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #ece6da; --ink: #262838; --chip: #f6f2ea;
    --glass: rgb(246 242 234 / 0.5);
    --edge: 1.25rem;   /* gap to the screen edge, in the safe area */
    --top: max(var(--edge) * 0.5, env(safe-area-inset-top));
    --right: max(var(--edge), env(safe-area-inset-right));
    --bottom: max(var(--edge), env(safe-area-inset-bottom));
    --left: max(var(--edge), env(safe-area-inset-left));
    --under: 0px;    /* iOS home screen app: screen height under the short viewport (fillScreen in screen.js) */
    --gap-x: max(0.5rem, env(safe-area-inset-left), env(safe-area-inset-right));   /* side gap of the bars */
    --cell: 3rem;     /* diamond grid cell */
    --act: 3.75rem;   /* diamond button */
    --stick: 8rem;
    --knob: 3.5rem;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--ink);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
    touch-action: none;
  }
  body { font: 0.875rem/1.4 system-ui, sans-serif; }   /* not on html: 1rem stays 16px */
  /* lvh: the large viewport. In iOS Safari the canvas goes on under the address and tab bars.
     --app-h: the screen height in an iOS home screen app, where lvh can be short. */
  canvas { position: fixed; inset: 0 auto auto 0; display: block; width: 100vw; height: 100vh; height: var(--app-h, 100lvh); cursor: grab; }
  canvas:active { cursor: grabbing; }
  button { font: inherit; color: inherit; touch-action: none; cursor: pointer; -webkit-user-select: none; user-select: none; }
  [hidden] { display: none !important; }

  /* Move buttons (bottom) and the top bar (Wet, then the free play actions). */
  .bar { position: fixed; inset: auto var(--gap-x) calc(var(--bottom) + 1.75rem - var(--under)); display: flex; flex-wrap: wrap; justify-content: center; gap: 0.375rem; }
  .bar.weather { inset: var(--top) var(--gap-x) auto; justify-content: end; }
  .bar button { padding: 0.375rem 0.875rem; border: 0.094rem solid var(--ink); border-radius: 999px; background: var(--chip); }
  .bar button[aria-pressed="true"] { background: var(--ink); color: var(--chip); }

  /* Free play: joystick bottom left, action diamond bottom right. */
  .stick, .acts { position: fixed; bottom: calc(var(--bottom) - var(--under)); }
  .stick { left: var(--left); width: var(--stick); aspect-ratio: 1; border-radius: 50%; background: rgb(246 242 234 / 0.2); backdrop-filter: blur(0.25rem); -webkit-backdrop-filter: blur(0.25rem); }
  .knob { position: absolute; inset: 50% auto auto 50%; width: var(--knob); aspect-ratio: 1; margin: calc(var(--knob) / -2) 0 0 calc(var(--knob) / -2); border: 0.094rem solid var(--ink); border-radius: 50%; background: var(--chip); pointer-events: none; }
  .acts { right: var(--right); display: grid; grid-template: repeat(3, var(--cell)) / repeat(3, var(--cell)); }
  .acts button { display: grid; place-items: center; width: var(--act); height: var(--act); margin: calc((var(--cell) - var(--act)) / 2); padding: 0; border: 0; border-radius: 50%; background: var(--glass); backdrop-filter: blur(0.25rem); -webkit-backdrop-filter: blur(0.25rem); }
  .acts button:active, .acts button[aria-pressed="true"] { background: var(--ink); color: var(--chip); }

  .ico { width: 2.375rem; height: 2.375rem; pointer-events: none; }
  .ico path { fill: currentColor; stroke: currentColor; stroke-width: 1; stroke-linejoin: round; }
  .ico .s { fill: none; stroke-width: 2.4; stroke-linecap: round; }

  @media (max-width: 37.5rem) {
    .bar { bottom: calc(var(--bottom) - var(--under)); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar" id="bar"></div>
<div class="bar weather" id="weather"></div>
<div class="stick" id="stick" hidden><div class="knob"></div></div>
<div class="acts" id="acts" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
