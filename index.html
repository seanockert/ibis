<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ibis</title>
<meta name="description" content="A bin chicken loose on a suburban street">
<meta name="theme-color" content="#ece6da">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ibis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #ece6da; --ink: #262838; --chip: #f6f2ea;
    --glass: rgb(246 242 234 / 0.5);
    --edge: 1.25rem;   /* gap to the screen edge, in the safe area */
    --top: max(var(--edge) * 0.5, env(safe-area-inset-top));
    --right: max(var(--edge), env(safe-area-inset-right));
    --bottom: max(var(--edge), env(safe-area-inset-bottom));
    --left: max(var(--edge), env(safe-area-inset-left));
    --gap-x: max(0.5rem, env(safe-area-inset-left), env(safe-area-inset-right));   /* side gap of the bars */
    --cell: 3rem;     /* diamond grid cell */
    --act: 3.75rem;   /* diamond button */
    --stick: 8rem;
    --knob: 3.5rem;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--ink);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
    touch-action: none;
  }
  body { font: 0.875rem/1.4 system-ui, sans-serif; }   /* not on html: 1rem stays 16px */
  /* iOS 26 home screen app: a page shorter than the screen gets a short viewport (WebKit bug 301108).
     min(): no scroll when the top inset is 0. */
  @media (display-mode: standalone) {
    html { min-height: min(100lvh, calc(100% + env(safe-area-inset-top))); }
  }
  /* lvh: the large viewport. In iOS Safari the canvas goes on under the address and tab bars. */
  canvas { position: fixed; inset: 0 auto auto 0; display: block; width: 100vw; height: 100vh; height: 100lvh; cursor: grab; }
  canvas:active { cursor: grabbing; }
  button { font: inherit; color: inherit; touch-action: none; cursor: pointer; -webkit-user-select: none; user-select: none; }
  [hidden] { display: none !important; }

  /* Move buttons (bottom) and the top bar (Wet, then the free play actions). */
  .bar { position: fixed; inset: auto var(--gap-x) calc(var(--bottom) + 1.75rem); display: flex; flex-wrap: wrap; justify-content: center; gap: 0.375rem; }
  .bar.weather { inset: var(--top) var(--gap-x) auto; justify-content: end; }
  .bar button { padding: 0.375rem 0.875rem; border: 0.094rem solid var(--ink); border-radius: 999px; background: var(--chip); }
  .bar button[aria-pressed="true"] { background: var(--ink); color: var(--chip); }

  /* Free play: joystick bottom left, action diamond bottom right. */
  .stick, .acts { position: fixed; bottom: var(--bottom); }
  .stick { left: var(--left); width: var(--stick); aspect-ratio: 1; border-radius: 50%; background: rgb(246 242 234 / 0.2); backdrop-filter: blur(0.25rem); -webkit-backdrop-filter: blur(0.25rem); }
  .knob { position: absolute; inset: 50% auto auto 50%; width: var(--knob); aspect-ratio: 1; margin: calc(var(--knob) / -2) 0 0 calc(var(--knob) / -2); border: 0.094rem solid var(--ink); border-radius: 50%; background: var(--chip); pointer-events: none; }
  .acts { right: var(--right); display: grid; grid-template: repeat(3, var(--cell)) / repeat(3, var(--cell)); }
  .acts button { display: grid; place-items: center; width: var(--act); height: var(--act); margin: calc((var(--cell) - var(--act)) / 2); padding: 0; border: 0; border-radius: 50%; background: var(--glass); backdrop-filter: blur(0.25rem); -webkit-backdrop-filter: blur(0.25rem); }
  .acts button:active, .acts button[aria-pressed="true"] { background: var(--ink); color: var(--chip); }

  .ico { width: 2.375rem; height: 2.375rem; pointer-events: none; }
  .ico path { fill: currentColor; stroke: currentColor; stroke-width: 0; stroke-linejoin: round; }
  .ico .s { fill: none; stroke-width: 2.4; stroke-linecap: round; }

  /* Frame meter (src/app/meter.js), top left. */
  .meter { position: fixed; top: var(--top); left: var(--left); margin: 0; padding: 0.25rem 0.5rem; border-radius: 0.375rem; background: rgb(38 40 56 / 0.6); color: var(--chip); font: 0.6875rem/1.35 ui-monospace, monospace; white-space: pre; pointer-events: none; }

  /* Mission (src/app/hud.js, challenges.js): the goal, the count and a hint, top left; the win banner. */
  .hud { position: fixed; top: calc(var(--top) + 3.25rem); left: var(--left); width: min(19rem, calc(100vw - 2 * var(--left))); padding: 0.5rem 0.75rem; border: 0.094rem solid var(--ink); border-radius: 0.75rem; background: rgb(246 242 234 / 0.88); font-size: 0.8125rem; pointer-events: none; }
  .hud .goal { font-weight: 700; }
  .hud .count { margin: 0.25rem 0; font-weight: 700; color: #b0452e; white-space: pre-line; }
  .win { position: fixed; inset: 50% auto auto 50%; transform: translate(-50%, -50%); padding: 1.25rem 1.75rem; border: 0.125rem solid var(--ink); border-radius: 1rem; background: var(--chip); text-align: center; }
  .win h2 { margin: 0 0 0.25rem; font-size: 1.5rem; }
  .win p { margin: 0 0 0.75rem; }
  .win button { padding: 0.375rem 0.875rem; border: 0.094rem solid var(--ink); border-radius: 999px; background: var(--ink); color: var(--chip); }

  /* Combo toy (src/app/comboHud.js): the clock and the total, the combo over the bird, the pops, the hint. */
  .combo { position: fixed; inset: 0; pointer-events: none; font-weight: 800; }
  .combo .clock { position: absolute; top: calc(var(--top) + 0.25rem); left: 50%; transform: translateX(-50%); display: flex; gap: 1rem; align-items: baseline; padding: 0.25rem 1rem; border: 0.125rem solid var(--ink); border-radius: 999px; background: rgb(246 242 234 / 0.92); }
  .combo .clock .time { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .combo .clock .time.low { color: #c23b22; }
  .combo .clock .total { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .combo .pops { position: absolute; top: calc(var(--top) + 3.5rem); left: 50%; transform: translateX(-50%); text-align: center; }
  .combo .pop { font-size: 1.25rem; color: #1f7a3a; text-shadow: 0 0.1rem 0 var(--chip); animation: pop 2.2s ease-out forwards; }
  .combo .pop.big { font-size: 1.75rem; color: #c2581f; }
  @keyframes pop { 0% { transform: scale(1.6); opacity: 0; } 10% { transform: scale(1); opacity: 1; } 75% { opacity: 1; } 100% { transform: translateY(-1rem); opacity: 0; } }
  .combo .run { position: absolute; top: 0; left: 0; width: max-content; max-width: min(34rem, 90vw); text-align: center; }
  .combo .fuse { width: 8rem; height: 0.5rem; margin: 0 auto 0.25rem; border: 0.094rem solid var(--ink); border-radius: 999px; background: rgb(246 242 234 / 0.8); overflow: hidden; }
  .combo .fuse i { display: block; height: 100%; background: #f2a516; transform-origin: left; }
  .combo .fuse i.short { background: #d8432a; }
  .combo .value { font-size: 1.5rem; color: var(--chip); -webkit-text-stroke: 0.4rem var(--ink); paint-order: stroke fill; }
  .combo .links { font-size: 0.8125rem; color: var(--ink); text-shadow: 0 0 0.25rem var(--chip), 0 0 0.25rem var(--chip); }
  .combo .links .faded { opacity: 0.45; }
  .combo .links .new { color: #b0452e; }
  .combo .hint { position: absolute; bottom: calc(var(--bottom) + 9.5rem); left: 50%; transform: translateX(-50%); width: min(30rem, 90vw); padding: 0.5rem 0.75rem; border: 0.094rem solid var(--ink); border-radius: 0.75rem; background: rgb(246 242 234 / 0.9); font-weight: 600; text-align: center; }

  @media (max-width: 37.5rem) {
    .bar { bottom: var(--bottom); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar" id="bar"></div>
<div class="bar weather" id="weather"></div>
<pre class="meter" id="meter" hidden></pre>
<div class="stick" id="stick" hidden><div class="knob"></div></div>
<div class="acts" id="acts" hidden></div>
<div class="hud" id="hud" hidden><div class="goal"></div><div class="count"></div><div class="hint"></div></div>
<div class="combo" id="combo" hidden><div class="clock"><span class="time"></span><span class="total"></span></div><div class="pops"></div><div class="run"><div class="fuse"><i></i></div><div class="value"></div><div class="links"></div></div><div class="hint"></div></div>
<div class="win" id="win" hidden><h2></h2><p>Time <span class="time"></span></p><button>Play again (R)</button></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
