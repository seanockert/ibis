<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ibis</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #ece6da; --ink: #262838; --accent: #d64d33; --chip: #f6f2ea; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0); touch-action: manipulation; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  .bar { position: fixed; bottom: 3rem; display: flex; gap: 6px; flex-wrap: wrap; width: 100vw; justify-content: center; }
  .bar button { border: 1.5px solid var(--ink); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; user-select: none; }
  .bar button[aria-pressed="true"] { background: var(--ink); color: var(--chip); }
  .bar.weather { top: 0.5rem; bottom: auto; transform: none; right: 0.5rem; justify-content: end; }
  /* Free play: joystick bottom left, action diamond bottom right, the other actions in the top bar. */
  .stick, .acts { position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .stick { left: 20px; width: 128px; height: 128px; border-radius: 50%; backdrop-filter: blur(4px); background: rgb(246 242 234 / 0.2); }
  .stick .knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--chip); box-sizing: border-box; pointer-events: none; }
  .acts { right: 20px; display: grid; grid-template: repeat(3, 48px) / repeat(3, 48px); }
  .acts button { width: 60px; height: 60px; margin: -6px; padding: 0; border: none; border-radius: 50%; backdrop-filter: blur(4px); background: rgb(246 242 234 / 0.5); color: var(--ink); display: grid; place-items: center; cursor: pointer; touch-action: none; }
  .acts button:active, .acts button[aria-pressed="true"] { background: var(--ink); color: var(--chip); }
  .acts .ico { width: 38px; height: 38px; }
  .ico { pointer-events: none; }
  .ico path { fill: currentColor; stroke: currentColor; stroke-width: 1; stroke-linejoin: round; }
  .ico .s { fill: none; stroke-width: 2.4; stroke-linecap: round; }
  .bar[hidden], .stick[hidden], .acts[hidden] { display: none; }
  @media (max-width: 600px) {
    .bar { bottom: 1rem; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar" id="bar"></div>
<div class="bar weather" id="weather"></div>
<div class="stick" id="stick" hidden><div class="knob"></div></div>
<div class="acts" id="acts" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
