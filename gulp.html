<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Toss and Gulp</title>
<meta name="description" content="Catch, toss and swallow. A bin chicken arcade game.">
<meta name="theme-color" content="#cde0ec">
<meta name="color-scheme" content="light">
<link rel="icon" href="/icon-192.png" type="image/png">
<style>
  :root {
    --ink: #262838; --chip: #f6f2ea; --red: #c8402e; --gold: #e7a923;
    --top: max(0.75rem, env(safe-area-inset-top));
    --bottom: max(1rem, env(safe-area-inset-bottom));
    --left: max(1rem, env(safe-area-inset-left));
    --right: max(1rem, env(safe-area-inset-right));
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #cde0ec; color: var(--ink);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; font: 600 1rem/1.3 system-ui, sans-serif;
  }
  canvas { position: fixed; inset: 0 auto auto 0; display: block; width: 100vw; height: 100vh; height: 100lvh; }
  [hidden] { display: none !important; }
  #hud { position: fixed; inset: 0; pointer-events: none; }

  .bar { position: absolute; top: var(--top); left: var(--left); right: var(--right); display: flex; align-items: flex-start; gap: 0.75rem; }
  .score { font-size: 2.5rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .mult { padding: 0.15rem 0.6rem; border-radius: 999px; background: var(--ink); color: var(--chip); font-size: 1.25rem; font-weight: 800; }
  .mult.bump { animation: bump 0.25s ease-out; }
  .lives { margin-left: auto; color: var(--red); font-size: 1.75rem; line-height: 1; letter-spacing: 0.1em; }
  .lives.hurt { animation: hurt 0.4s ease-out; }
  .best { position: absolute; top: calc(var(--top) + 2.7rem); left: var(--left); font-size: 0.85rem; opacity: 0.7; }

  .pops { position: absolute; inset: 0; }
  .pop { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: 1.4rem; font-weight: 800;
    color: var(--chip); -webkit-text-stroke: 0.4rem var(--ink); paint-order: stroke fill; animation: rise 1.1s ease-out forwards; }
  .pop.perfect { color: var(--gold); font-size: 1.7rem; }
  .pop.bad { color: var(--red); }
  .pop.gulp { font-size: 1.2rem; }

  .card { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%); width: min(22rem, calc(100vw - 2rem));
    padding: 1.25rem 1.5rem; border: 0.15rem solid var(--ink); border-radius: 1rem; background: rgb(246 242 234 / 0.94); text-align: center; }
  .card h1 { margin: 0 0 0.5rem; font-size: 2rem; font-weight: 800; }
  .card p { margin: 0.35rem 0; font-weight: 500; }
  .card.over { top: 30%; }
  .card .final { font-size: 3rem; font-weight: 800; line-height: 1.1; }
  .card .go { margin-top: 0.75rem; font-weight: 800; }

  .pad { position: fixed; bottom: var(--bottom); display: flex; gap: 0.75rem; }
  .pad.move { left: var(--left); }
  .pad.act { right: var(--right); }
  .pad button { width: 4.5rem; height: 4.5rem; border: 0.15rem solid var(--ink); border-radius: 50%; background: rgb(246 242 234 / 0.6);
    font: 800 1.5rem/1 system-ui, sans-serif; color: var(--ink); touch-action: none; }
  .pad button:active { background: var(--ink); color: var(--chip); }
  .pad.act button { width: 6rem; height: 6rem; font-size: 1.1rem; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }

  @keyframes rise { 0% { opacity: 0; translate: 0 0.5rem; scale: 0.6; } 15% { opacity: 1; scale: 1.15; } 30% { scale: 1; } 100% { opacity: 0; translate: 0 -3rem; } }
  @keyframes bump { 0% { scale: 1.5; } 100% { scale: 1; } }
  @keyframes hurt { 0%, 100% { translate: 0; } 20% { translate: -0.4rem; } 40% { translate: 0.4rem; } 60% { translate: -0.25rem; } 80% { translate: 0.25rem; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="bar"><div class="score">0</div><div class="mult" hidden>x1</div><div class="lives">♥♥♥</div></div>
  <div class="best">Best 0</div>
  <div class="pops"></div>
  <div class="card title">
    <h1>Toss and Gulp</h1>
    <p>Catch the food in your bill as it lands.</p>
    <p>Catch it enough times and down it goes.</p>
    <p>Perfect catches build your multiplier.</p>
    <p class="go">Space or tap to catch. Arrows to waddle.</p>
  </div>
  <div class="card over" hidden>
    <h1>Fainted</h1>
    <div class="final">0</div>
    <p class="note"></p>
    <p class="go">Space or tap to go again</p>
  </div>
</div>
<div class="pad move"><button data-hold="left" aria-label="Waddle left">◀</button><button data-hold="right" aria-label="Waddle right">▶</button></div>
<div class="pad act"><button id="catch">Catch</button></div>
<script type="module" src="/src/gulp/main.js"></script>
</body>
</html>
